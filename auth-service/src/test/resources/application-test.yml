spring:
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

eureka:
  client:
    enabled: false

jwt:
  secret: auth-service-test-secret-key-at-least-32-bytes-long
  expiration-ms: 3600000

# 本课只练习 HTTP 链路，使用本地配置启动。
spring:
  cloud:
    config:
      enabled: false
    bus:
      enabled: false

server:
  port: 9101

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9761/eureka/
  instance:
    prefer-ip-address: true

lesson:
  user-name: 链路追踪练习用户

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: W3C
    export:
      zipkin:
        enabled: true
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}] "

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  cache:
    type: none

jwt:
  secret: test-jwt-secret-key-must-have-at-least-32-characters
  expiration-ms: 3600000